<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        //Tugas 1
        function hitungLuasLingkaran(jariJari) {
     return Math.PI * (jariJari ** 2);
    } 
    console.log(hitungLuasLingkaran(7)); // Output: 153.93804002589985

        //Tugas 2
        function cariBilanganTerbesar(a, b, c) {
     return Math.max(a, b, c);
}
    console.log(cariBilanganTerbesar(12, 45, 29)); // Output: 45

        //Tugas 3
        const keHurufBesar = (teks) => teks.toUpperCase();
    console.log(keHurufBesar("belajar javascript")); // Output: BELAJAR JAVASCRIPT

        //Tugas 4
        const kumpulanAngka = [4, 15, 8, 23, 10, 42, 7];
        const lebihDariSepuluh = kumpulanAngka.filter((angka) => angka > 10);
    console.log(lebihDariSepuluh); // Output: [15, 23, 42]
    </script>

</body>
</html>
