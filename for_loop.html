<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        // 1. Perulangan angka dari 1 sampai 10
for (let i = 1; i <= 10; i++) {
  console.log(i);
}

// 2. Perulangan hitungan mundur dari 5 sampai 1, diikuti "Mulai!"
for (let j = 5; j >= 1; j--) {
  console.log(j);
}
console.log("Mulai!");
    </script>
</body>
</html>
