<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let angka = 1;
let total = 0;

while (angka <= 5) {
  total += angka; // Menambahkan nilai angka ke total (sama dengan total = total + angka)
  angka++;        // Menaikkan nilai angka sebesar 1 di setiap putaran
}

console.log(total); // Output: 15
    </script>
</body>
</html>
