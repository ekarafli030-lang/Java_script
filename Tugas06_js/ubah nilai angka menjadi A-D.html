<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script>
        let nilai = 82;
let predikat;

if (nilai >= 85 && nilai <= 100) {
  predikat = "A";
} else if (nilai >= 75) {
  predikat = "B";
} else if (nilai >= 60) {
  predikat = "C";
} else if (nilai >= 0) {
  predikat = "D";
} else {
  predikat = "Nilai tidak valid";
}

console.log("Predikat: " + predikat);
    </script>
</body>
